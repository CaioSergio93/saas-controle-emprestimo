<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Gestão - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 flex h-screen w-screen items-center justify-center font-sans">

    <div class="w-full max-w-md rounded-2xl bg-slate-800 p-8 shadow-2xl border border-slate-700">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-white tracking-tight">💳 SaaS Card</h1>
            <p class="text-slate-400 mt-2 text-sm">Entre na sua conta para gerenciar seus empréstimos</p>
        </div>

        {% if form.errors %}
            <div class="mb-4 rounded-lg bg-red-500/10 p-3 text-sm text-red-400 border border-red-500/20">
                Usuário ou senha incorretos. Tente novamente.
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-5">
                <label class="block text-xs font-bold uppercase tracking-wide text-slate-400 mb-2">Usuário</label>
                <input type="text" name="username" required class="w-full rounded-xl bg-slate-950 border border-slate-700 px-4 py-3 text-white placeholder-slate-500 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
            </div>

            <div class="mb-6">
                <label class="block text-xs font-bold uppercase tracking-wide text-slate-400 mb-2">Senha</label>
                <input type="password" name="password" required class="w-full rounded-xl bg-slate-950 border border-slate-700 px-4 py-3 text-white placeholder-slate-500 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
            </div>

            <button type="submit" class="w-full rounded-xl bg-indigo-600 py-3 font-semibold text-white shadow-lg shadow-indigo-600/30 hover:bg-indigo-500 active:scale-[0.98] transition">
                Acessar Painel
            </button>
        </form>
    </div>

</body>
</html>
