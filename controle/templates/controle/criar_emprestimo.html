<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Card - Novo Registro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex items-center justify-center p-6">

    <div class="w-full max-w-2xl rounded-2xl border border-slate-800 bg-slate-900 p-8 shadow-2xl">
        <div class="flex justify-between items-center border-b border-slate-800 pb-5 mb-6">
            <div>
                <h2 class="text-2xl font-black text-white">Novo Empréstimo</h2>
                <p class="text-xs text-slate-400 mt-1">Preencha conforme informado pela operadora do cartão.</p>
            </div>
            <a href="/" class="text-xs font-bold text-indigo-400 hover:text-indigo-300 transition">⬅ Cancelar</a>
        </div>

        <form method="POST" class="space-y-5">
            {% csrf_token %}
            
            <div>
                <label class="block text-xs font-bold uppercase tracking-wide text-slate-400 mb-2">Nome do Cliente</label>
                <input type="text" name="cliente" required class="w-full rounded-xl bg-slate-950 border border-slate-700 px-4 py-3 text-white outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wide text-slate-400 mb-2">Cartão Utilizado</label>
                <select name="cartao_utilizado" class="w-full rounded-xl bg-slate-950 border border-slate-700 px-4 py-3 text-white outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
                    {% for valor, nome in opcoes_bancos %}
                        <option value="{{ valor }}">{{ nome }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wide text-slate-400 mb-2">Valor Total</label>
                    <input type="number" step="0.01" name="valor_total" required class="w-full rounded-xl bg-slate-950 border border-slate-700 px-4 py-3 text-white outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wide text-slate-400 mb-2">Valor Parcela</label>
                    <input type="number" step="0.01" name="valor_parcela" required class="w-full rounded-xl bg-slate-950 border border-slate-700 px-4 py-3 text-white outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wide text-slate-400 mb-2">Valor Faltante</label>
                    <input type="number" step="0.01" name="valor_faltante" required class="w-full rounded-xl bg-slate-950 border border-slate-700 px-4 py-3 text-white outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
                </div>
            </div>

            <div class="grid grid-cols-3 gap-4 bg-slate-950 p-4 rounded-xl border border-slate-800">
                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-wide text-slate-400 mb-1">Parc. Totais</label>
                    <input type="number" name="parcelas_totais" required class="w-full bg-slate-900 rounded-lg border border-slate-700 p-2 text-center text-white outline-none focus:border-indigo-500 transition">
                </div>
                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-wide text-slate-400 mb-1">Parc. Pagas</label>
                    <input type="number" name="parcelas_pagas" value="0" required class="w-full bg-slate-900 rounded-lg border border-slate-700 p-2 text-center text-white outline-none focus:border-indigo-500 transition">
                </div>
                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-wide text-slate-400 mb-1">Parc. Faltantes</label>
                    <input type="number" name="parcelas_faltantes" value="0" required class="w-full bg-slate-900 rounded-lg border border-slate-700 p-2 text-center text-white outline-none focus:border-indigo-500 transition">
                </div>
            </div>

            <div class="flex justify-end space-x-3 pt-4 border-t border-slate-800">
                <a href="/" class="rounded-xl border border-slate-700 bg-slate-800 px-5 py-3 font-semibold text-slate-300 hover:bg-slate-700 transition">Voltar</a>
                <button type="submit" class="rounded-xl bg-indigo-600 px-5 py-3 font-semibold text-white shadow-lg shadow-indigo-600/30 hover:bg-indigo-500 active:scale-[0.98] transition">
                    Salvar Registro
                </button>
            </div>
        </form>
    </div>

</body>
</html>
